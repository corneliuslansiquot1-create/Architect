; ---------------------------------------------------------------------------
; ArchitectProto project settings (these only affect THIS project).
; ---------------------------------------------------------------------------

[/Script/EngineSettings.GameMapsSettings]
; The map you save in step 1 of the README. Change in Project Settings > Maps & Modes.
EditorStartupMap=/Game/Maps/L_Proto.L_Proto
GameDefaultMap=/Game/Maps/L_Proto.L_Proto
; Our C++ game mode: it spawns the room automatically when you press Play.
GlobalDefaultGameMode=/Script/ArchitectProto.ArchitectGameMode

[/Script/Engine.RendererSettings]
; Fully dynamic lighting (Lumen), no baked lighting, as the brief asks.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
